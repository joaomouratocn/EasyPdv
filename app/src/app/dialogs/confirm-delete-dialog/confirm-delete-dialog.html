<div class="p-4">
  <h2 class="font-semibold">Confirmar</h2>
  <mat-dialog-content>
    <p class="text-gray-700">
      Tem certeza que deseja deletar esta <span>{{ nameDelete }}</span
      >?
    </p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="flex gap-1">
    <button
      mat-button
      mat-dialog-close
      class="bg-red-600 text-white rounded-lg px-6 py-2 block hover:bg-red-700 font-medium shadow-md transition-transform !active:scale-95"
    >
      Cancelar
    </button>
    <button
      mat-button
      [mat-dialog-close]="true"
      class="bg-blue-600 text-white rounded-lg px-6 py-2 block hover:bg-blue-700 font-medium shadow-md transition-transform !active:scale-95"
    >
      Deletar
    </button>
  </mat-dialog-actions>
</div>
