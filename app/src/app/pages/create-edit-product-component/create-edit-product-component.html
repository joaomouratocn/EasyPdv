<div class="container h-full p-4 flex flex-col mx-auto">
  <h1 class="text-3xl font-bold mb-4 mx-auto text-gray-800">{{ actionType() }}</h1>
  <form [formGroup]="receivedProduct" class="flex flex-col gap-1">
    <div>
      <label for="name">Nome: </label>
      <input
        id="name"
        name="name"
        type="text"
        formControlName="name"
        class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
      />
    </div>
    <div>
      <label for="barcode">Código de Barras: </label>
      <input
        id="barcode"
        name="barcode"
        type="text"
        formControlName="barcode"
        class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
      />
    </div>
    <div>
      <label for="category">Selecione um categoria:</label>

      <select name="category" id="category" formControlName="category">
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
      </select>
    </div>
    <div>
      <label for="stock">Quantidade de entrada: </label>
      <input
        id="stock"
        name="stock"
        type="text"
        formControlName="stock"
        class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
      />
    </div>
    <div>
      <label for="buy_price">Preço de compra: </label>
      <input
        id="buy_price"
        name="buy_price"
        type="text"
        formControlName="buy_price"
        class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
      />
    </div>
    <div>
      <label for="sale_price">Preço de venda: </label>
      <input
        id="sale_price"
        name="sale_price"
        type="text"
        formControlName="sale_price"
        class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
      />
    </div>
    <div>
      <input type="checkbox" id="enable-alert" name="enable-alert" formControlName="alert_stock" />
      <label for="enable-alert" class="px-1">Ativar alerta de estoque baixo</label>
    </div>
  </form>
</div>
