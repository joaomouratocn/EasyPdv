<div class="container h-full p-4 flex flex-col mx-auto">
  <h1 class="text-3xl font-bold mb-4 mx-auto text-gray-800">Clientes</h1>

  <input
    type="text"
    name="searchCustomer"
    placeholder="Procurando Clientes..."
    [(ngModel)]="customerName"
    class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
  />

  <div class="flex flex-1 overflow-auto">
    @if (loading()) {
      <div class="flex flex-col items-center justify-center flex-1">
        <mat-spinner mode="indeterminate" color="primary" [diameter]="50" />
        <span class="text-gray-500 italic">Carregando clientes...</span>
      </div>
    } @else {
      <div class="overflow-x-auto shadow-md rounded-xl w-full">
        <table class="w-full text-left border-collapse bg-white">
          <thead>
            <tr class="bg-gray-300 text-gray-700 uppercase text-sm">
              <th class="px-6 py-3 font-bold w-1/3">Nome</th>
              <th class="px-6 py-3 font-bold">CPF</th>
              <th class="px-6 py-3 font-bold text-center">Ações</th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200">
            @for (customer of filteredCustomer(); track customer.id) {
              <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4">
                  <div class="font-medium text-gray-900 wrap-break-word max-w-62.5">
                    {{ customer.name }}
                  </div>
                </td>

                <td class="px-6 py-4 text-gray-700 whitespace-nowrap">
                  {{ customer.cpf }}
                </td>

                <td class="px-6 py-4">
                  <div class="flex space-x-2 justify-center">
                    <button
                      (click)="openDetailDialog(customer)"
                      class="bg-green-500 text-white rounded-lg px-3 py-1.5 text-xs hover:bg-green-600 transition shadow-sm"
                    >
                      Detalhes
                    </button>
                    <button
                      [routerLink]="['edit', customer.id]"
                      class="bg-blue-500 text-white rounded-lg px-3 py-1.5 text-xs hover:bg-blue-600 transition shadow-sm"
                    >
                      Editar
                    </button>
                    <button
                      (click)="openDeleteDialog(customer)"
                      class="bg-red-500 text-white rounded-lg px-3 py-1.5 text-xs hover:bg-red-600 transition shadow-sm"
                    >
                      Deletar
                    </button>
                  </div>
                </td>
              </tr>
            } @empty {
              <tr class="hover:bg-gray-50 transition-colors mt-4">
                <td
                  colspan="5"
                  class="py-10 text-center text-gray-500 italic bg-gray-50 rounded-xl border-2 border-dashed"
                >
                  Nenhum cliente encontrado...
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
  <button
    [routerLink]="['new']"
    class="bg-blue-600 text-white rounded-lg px-6 py-2 block ml-auto hover:bg-blue-700 font-medium shadow-md transition-transform active:scale-95 mt-4"
  >
    + Novo Cliente
  </button>
</div>
