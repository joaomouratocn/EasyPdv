<div class="container h-full p-4 flex flex-col mx-auto">
  <h1 class="text-3xl font-bold mb-4 mx-auto text-gray-800">Unidade de Medidas</h1>

  <input
    type="text"
    name="searchCategories"
    placeholder="Search categories..."
    [(ngModel)]="measureName"
    class="border rounded-lg p-2 mb-4 w-full focus:ring focus:ring-blue-500 outline-none"
  />

  <div class="flex flex-1 overflow-auto">
    @if (loading()) {
      <div class="flex flex-col items-center justify-center flex-1">
        <mat-spinner mode="indeterminate" color="primary" [diameter]="50" />
        <span class="text-gray-500 italic">Carregando unidades...</span>
      </div>
    } @else {
      <ul class="space-y-2 flex-1 rounded bg-gray-100">
        <li class="flex items-center justify-between px-8 py-2 bg-gray-300 rounded">
          <span class="font-medium text-gray-700">Nome</span>
          <span class="font-medium text-gray-700">Ação</span>
        </li>
        @for (measure of filteredMeasure(); track measure.id) {
          <li
            class="flex items-center justify-between p-2 mx-1 bg-white rounded-xl hover:bg-gray-100 transition-colors shadow-sm"
          >
            <span class="font-medium text-gray-700">{{ measure.name }}</span>

            <div class="flex space-x-2">
              <button
                (click)="openDialogMeasure(measure)"
                class="bg-blue-500 text-white rounded-lg px-3 py-1.5 text-sm hover:bg-blue-600 transition"
              >
                Editar
              </button>
              <button
                (click)="openDialogDeleteMeasure(measure)"
                class="bg-red-500 text-white rounded-lg px-3 py-1.5 text-sm hover:bg-red-600 transition"
              >
                Deletar
              </button>
            </div>
          </li>
        } @empty {
          <li
            class="py-10 text-center text-gray-500 italic bg-gray-50 rounded-xl border-2 border-dashed"
          >
            Nenhuma unidade encontrada.
          </li>
        }
      </ul>
    }
  </div>

  <div class="mt-4">
    <button
      (click)="openDialogMeasure({ id: '', name: '' })"
      class="bg-blue-600 text-white rounded-lg px-6 py-2 block ml-auto hover:bg-blue-700 font-medium shadow-md transition-transform active:scale-95"
    >
      + Nova Unidade de Medida
    </button>
  </div>
</div>
